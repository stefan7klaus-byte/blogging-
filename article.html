<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Article | Zenith Hackers Intelligence</title><link rel="stylesheet" href="styles.css"></head><body><div class="background"></div><main class="section-shell article-page"><a class="button secondary" href="index.html#articles">← Back to articles</a><article id="article" class="article-body glass" style="margin-top:20px"><h1>Loading article…</h1></article></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client-config.js"></script><script>const c=supabase.createClient(ZENITH_SUPABASE.url,ZENITH_SUPABASE.publishableKey),r=document.getElementById("article"),s=new URLSearchParams(location.search).get("slug"),e=v=>String(v??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[x]));(async()=>{if(!s){r.innerHTML="<h1>Article not found</h1>";return}const{data:d,error}=await c.from("articles").select("title,content,excerpt,author_name,cover_image,published_at,categories(name)").eq("slug",s).eq("published",true).single();if(error||!d){r.innerHTML="<h1>Article not found</h1><p>This article may have been unpublished or moved.</p>";return}r.innerHTML=(d.cover_image?`<img src="${e(d.cover_image)}" alt="" style="width:100%;max-height:460px;object-fit:cover;border-radius:18px">`:"")+`<span class="tag">${e(d.categories?.name||"INTELLIGENCE")}</span><h1>${e(d.title)}</h1><p>${e(d.excerpt||"")}</p><small>${e(d.author_name)} · ${d.published_at?e(new Date(d.published_at).toLocaleDateString()):""}</small><div style="margin-top:30px;line-height:1.9">${e(d.content).replace(/\n/g,"<br><br>")}</div>`})()</script></body></html>
