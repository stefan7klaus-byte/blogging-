name: Generate SEO article pages
on:
  workflow_dispatch:
  push:
    paths:
      - 'content/seo-article-manifest.json'
      - 'content/seo-article-templates.json'
      - 'scripts/generate-seo-articles.py'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate article pages and sitemap
        run: python scripts/generate-seo-articles.py
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles sitemap.xml
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Generate ethical cybersecurity article pages and sitemap"
            git push
          fi
